name: Bug report
description: Report incorrect behavior or a regression
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100.x
    validations:
      required: true
  - type: input
    attributes:
      label: CodexTray version
      description: For a source build, include the commit hash as well as the version.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    attributes:
      label: Display configuration
      placeholder: Two monitors, 100% and 150% scaling
  - type: input
    attributes:
      label: Codex version
      description: For usage or activity-detection issues, include the Codex Desktop or CLI version.
  - type: textarea
    attributes:
      label: Widget settings
      description: For visual or activity issues, include the icon style, size, display mode, position, animation, synchronization, and project-color settings.
  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Include relevant startup.log lines if useful. Do not attach Codex session logs, credential files, or an entire .codex folder. Remove private paths and account data; crop screenshots to the widget.
